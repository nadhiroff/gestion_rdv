services:
  api:
    build: .
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      PORT: "4000"
      FRONTEND_ORIGIN: "*"
      # Une seule variable suffit : l'URL interne MySQL copiée depuis Coolify.
      # (Les DB_* séparées restent possibles, DATABASE_URL est prioritaire.)
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      ADMIN_CODE: ${ADMIN_CODE}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
