services:
  api:
    build: .
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      PORT: "4000"
      FRONTEND_ORIGIN: "*"
      # Base MySQL : l'URL interne copiée depuis la fiche de la base Coolify
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_CODE: ${ADMIN_CODE}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
